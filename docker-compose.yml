name: norma-ryadom

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: norma
      POSTGRES_USER: norma
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norma -d norma"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: chrislusf/seaweedfs:3.97
    entrypoint:
      - sh
      - -c
      - >-
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8333/ 2>&1 | grep -q '403'"]
      interval: 5s
      timeout: 3s
      retries: 30

  storage-init:
    image: chrislusf/seaweedfs:3.97
    depends_on:
      storage:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - echo "s3.bucket.create -name menu-photos" | weed shell -master=storage:9333
    restart: "no"

  server:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_URL: jdbc:postgresql://db:5432/norma
      DB_USER: norma
      DB_PASSWORD: ${DB_PASSWORD}
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}
      REPORTER_KEY: ${REPORTER_KEY:?REPORTER_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
  storage-data:
