spring:
  application:
    name: norma-ryadom
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/norma}
    username: ${DB_USER:norma}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 9MB
      max-request-size: 10MB
      resolve-lazily: true
  mvc:
    problemdetails:
      enabled: true
  cache:
    cache-names: bestCombos
    caffeine:
      spec: maximumSize=20000,expireAfterWrite=1h
  thymeleaf:
    cache: true
  web:
    locale: ru
    locale-resolver: fixed

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXIES_REGEX:}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html

optimizer:
  max-items: 3
  heap-factor: 4
  weights:
    kcal: 1.0
    protein: 0.6
    fat: 0.3
    carbs: 0.1
    trust-b: 0.15
    trust-c: 0.6
    price: 0.5
    price-scale-minor: 100000
  relaxation:
    kcal-tolerance-factor: 2.0
    protein-factor: 0.8
    limit-factor: 1.2

nearby:
  max-results: 50
  distance-weight-per-km: 0.5
  combos-per-venue: 2

intake:
  photo:
    max-size: 8MB
    max-pixels: 24000000
  ocr:
    worker-enabled: true
    poll-interval: 10s
    batch-size: 5
    data-path: ${TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
    language: rus+eng
  reports:
    review-threshold: 3
    reporter-key: ${REPORTER_KEY:}

storage:
  endpoint: ${S3_ENDPOINT:http://localhost:8333}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:menu-photos}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRET_KEY:}
  connect-timeout: 2s
  call-timeout: 10s

rate-limit:
  buckets:
    menu-photo:
      capacity: 5
      refill-period: 10m
    item-report:
      capacity: 20
      refill-period: 1h
    admin-login:
      capacity: 10
      refill-period: 15m

admin:
  username: ${ADMIN_USERNAME:admin}
  password-hash: ${ADMIN_PASSWORD_HASH:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
