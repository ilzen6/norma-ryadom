name: norma_ryadom
description: "Норма рядом: подбор блюд под норму КБЖУ в заведениях рядом."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  collection: 1.19.1
  dio: 5.11.1
  drift: 2.35.1
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: 8.3.2
  flutter_riverpod: 3.4.3
  freezed_annotation: 3.1.0
  geolocator: 14.1.1
  go_router: 18.0.2
  image_picker: 1.2.3
  intl: 0.20.3
  json_annotation: 4.12.0
  latlong2: 0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.16.1
  freezed: 4.0.2
  json_serializable: 6.14.1
  drift_dev: 2.35.1

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
