name: Basemap

on:
  push:
    branches: [main]
    paths:
      - "tool/basemap/**"
      - ".github/workflows/basemap.yml"

permissions:
  contents: write

jobs:
  basemap:
    name: Подложка карты из OpenStreetMap
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Сборка подложки
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install shapely==2.1.2
          curl -fL --retry 5 -o "$RUNNER_TEMP/region.osm.pbf" https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf
          osmium extract -b 37.495,55.722,37.690,55.798 --strategy smart "$RUNNER_TEMP/region.osm.pbf" -o "$RUNNER_TEMP/area.osm.pbf"
          osmium export "$RUNNER_TEMP/area.osm.pbf" -f geojsonseq --format-option print_record_separator=false -o "$RUNNER_TEMP/area.geojsonseq"
          python tool/basemap/build_basemap.py "$RUNNER_TEMP/area.geojsonseq" "$RUNNER_TEMP/basemap.json"
          ls -la "$RUNNER_TEMP/basemap.json"
      - name: Публикация в ветку basemap-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan basemap-data
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/basemap.json" basemap.json
          git add basemap.json
          git commit -m "chore: basemap from OpenStreetMap"
          git push -f origin basemap-data
