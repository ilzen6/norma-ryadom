name: Basemap

on:
  push:
    branches: [main]
    paths:
      - "tool/basemap/**"
      - ".github/workflows/basemap.yml"

permissions:
  contents: write

concurrency:
  group: basemap
  cancel-in-progress: true

jobs:
  basemap:
    name: Карты городов из OpenStreetMap
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Подкачка и рабочий диск
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo mkdir -p /mnt/work
          sudo chown "$USER" /mnt/work
          free -h
          df -h /mnt
      - name: Выгрузка и нарезка регионов
        env:
          WORK: /mnt/work
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install shapely==2.1.2 pyshp==2.3.1
          curl -fL --retry 5 -o "$WORK/russia.osm.pbf" https://download.geofabrik.de/russia-latest.osm.pbf
          mkdir -p "$WORK/regions"
          python tool/basemap/extracts.py "$WORK/regions" > "$WORK/extracts.json"
          osmium extract --config "$WORK/extracts.json" --strategy smart "$WORK/russia.osm.pbf"
          rm "$WORK/russia.osm.pbf"
          for region in $(python -c "import sys; sys.path.insert(0, 'tool/basemap'); from regions import REGIONS; print(' '.join(REGIONS))"); do
            osmium export "$WORK/regions/$region.osm.pbf" -f geojsonseq \
              --format-option print_record_separator=false -o "$WORK/regions/$region.geojsonseq"
          done
          python tool/basemap/build_tiles.py "$WORK/regions" "$RUNNER_TEMP/out"
          mkdir -p "$WORK/ne"
          for layer in 10m_physical/ne_10m_ocean 10m_physical/ne_10m_lakes 10m_physical/ne_10m_rivers_lake_centerlines \
            10m_cultural/ne_10m_admin_0_boundary_lines_land 10m_cultural/ne_10m_admin_1_states_provinces_lines \
            10m_cultural/ne_10m_populated_places 10m_cultural/ne_10m_roads 10m_cultural/ne_10m_railroads \
            10m_cultural/ne_10m_admin_0_countries; do
            for ext in shp shx dbf cpg; do
              curl -fsSL --retry 5 -o "$WORK/ne/$(basename "$layer").$ext" \
                "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/$layer.$ext"
            done
          done
          python tool/basemap/build_country.py "$WORK/ne" "$RUNNER_TEMP/out/map/country.json"
          du -sh "$RUNNER_TEMP/out/map" "$RUNNER_TEMP/out/map/packs"/* "$RUNNER_TEMP/out/places"
      - name: Публикация в ветку basemap-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan basemap-data
          git rm -rf --quiet .
          cp -r "$RUNNER_TEMP/out/map" "$RUNNER_TEMP/out/places" .
          git add map places
          git commit -q -m "chore: city maps and food places from OpenStreetMap"
          git push -f origin basemap-data
